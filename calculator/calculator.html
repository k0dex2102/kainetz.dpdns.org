<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./calculator.css" />
    <title>Calculator</title>
  </head>
  <body>
    <div id="back"><a href="/">← Back</a></div>
    <main class="calculator">
      <div class="display" id="display">0</div>
      <div class="buttons">
        <button class="clear" data-action="clear">C</button>
        <button data-action="sign">±</button>
        <button data-action="percent">%</button>
        <button class="operator" data-action="operator" data-value="÷">
          ÷
        </button>
        <button data-value="7">7</button> <button data-value="8">8</button>
        <button data-value="9">9</button>
        <button class="operator" data-action="operator" data-value="×">
          ×
        </button>
        <button data-value="4">4</button> <button data-value="5">5</button>
        <button data-value="6">6</button>
        <button class="operator" data-action="operator" data-value="−">
          −
        </button>
        <button data-value="1">1</button> <button data-value="2">2</button>
        <button data-value="3">3</button>
        <button class="operator" data-action="operator" data-value="+">
          +
        </button>
        <button class="zero" data-value="0">0</button>
        <button data-action="decimal">.</button>
        <button class="equals" data-action="equals">=</button>
      </div>
    </main>
    <script src="./calculator.js"></script>
  </body>
</html>
